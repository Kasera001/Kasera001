name: Generate F1 contribution circuit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate F1-themed contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kasera001
          outputs: |
            dist/f1-contribution.svg?color_snake=%23E10600&color_dots=%23161616,%234A0B0B,%238B0000,%23E10600,%23FF8700

      - name: Publish contribution animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
